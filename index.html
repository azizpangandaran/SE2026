<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monitoring Progress Pendataan SE2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

:root{

--primary:#005BAC;
--secondary:#1E88E5;
--orange:#F7941D;
--green:#43A047;
--red:#E53935;
--yellow:#FFD54F;
--purple:#7E57C2;
--dark:#263238;
--white:#ffffff;
--bg:#eef5fb;

}

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;

}

body{

background:linear-gradient(135deg,#edf5ff,#dbeeff);
min-height:100vh;
padding:25px;

}

body::before{

content:"";
position:fixed;
top:-150px;
left:-150px;
width:350px;
height:350px;
background:rgba(0,91,172,.08);
border-radius:50%;
z-index:-1;

}

body::after{

content:"";
position:fixed;
bottom:-180px;
right:-180px;
width:420px;
height:420px;
background:rgba(247,148,29,.10);
border-radius:50%;
z-index:-1;

}

.container{

max-width:1300px;
margin:auto;

}

.header{

background:linear-gradient(135deg,var(--primary),var(--secondary));
color:white;
padding:25px;
border-radius:25px;

display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;

box-shadow:0 15px 35px rgba(0,0,0,.15);

animation:slideDown .8s ease;

}

.title h1{

font-size:30px;
font-weight:700;

}

.title p{

margin-top:5px;
opacity:.9;

}

.logo{

width:70px;
height:70px;

background:white;

color:var(--primary);

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

font-size:34px;

box-shadow:0 8px 20px rgba(0,0,0,.2);

}

.input-area{

margin-top:30px;

display:grid;

grid-template-columns:repeat(auto-fit,minmax(180px,1fr));

gap:18px;

}

.box{

background:rgba(255,255,255,.75);

backdrop-filter:blur(12px);

padding:18px;

border-radius:18px;

box-shadow:0 8px 25px rgba(0,0,0,.08);

transition:.3s;

}

.box:hover{

transform:translateY(-6px);

box-shadow:0 15px 35px rgba(0,0,0,.15);

}

.box label{

display:block;

font-weight:600;

margin-bottom:10px;

color:#555;

}

.box input{

width:100%;

padding:14px;

font-size:18px;

border:none;

outline:none;

border-radius:12px;

background:#f7f9fc;

transition:.3s;

}

.box input:focus{

background:white;

box-shadow:0 0 0 3px rgba(0,91,172,.15);

}

.content-grid{

margin-top:35px;

display:grid;

grid-template-columns:1.1fr .9fr;
	gap:24px;
	align-items:start;

}

.panel{

background:rgba(255,255,255,.82);

backdrop-filter:blur(14px);

padding:24px;

border-radius:24px;

box-shadow:0 12px 30px rgba(0,0,0,.08);

border:1px solid rgba(0,91,172,.08);

}

.dashboard{

margin-top:28px;

display:grid;

grid-template-columns:repeat(auto-fit,minmax(150px,1fr));

gap:18px;

}

.card{

border-radius:22px;

padding:22px;

color:white;

position:relative;

overflow:hidden;

transition:.35s;

cursor:pointer;

box-shadow:0 15px 30px rgba(0,0,0,.15);

}

.card:hover{

transform:translateY(-8px) scale(1.03);

}

.card.active{

animation:cardPulse .45s ease;

}

.card::before{

content:"";

position:absolute;

border-radius:50%;

right:-70px;

top:-70px;

}

.card h4{

font-size:14px;

letter-spacing:1px;

opacity:.95;

}

.card h2{

margin-top:18px;

font-size:42px;

font-weight:700;

}

.orange{

background:linear-gradient(135deg,#FF9800,#F57C00);

}

.green{

background:linear-gradient(135deg,#43A047,#2E7D32);

}

.red{

background:linear-gradient(135deg,#EF5350,#C62828);

}

.blue{

background:linear-gradient(135deg,#2196F3,#1565C0);

}

.dark{

background:linear-gradient(135deg,#37474F,#263238);

}

.yellow{

background:linear-gradient(135deg,#FFD54F,#F9A825);

color:#222;

}

.purple{

background:linear-gradient(135deg,#7E57C2,#5E35B1);

}

.progress-section{

margin-top:0;

border-radius:25px;

padding:30px;

box-shadow:0 15px 35px rgba(0,0,0,.10);

}

.progress-title{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

}

.progress-title h2{

color:var(--primary);

}

.hint{

margin-top:18px;

padding:12px 14px;

border-radius:14px;

background:linear-gradient(135deg,rgba(0,91,172,.08),rgba(247,148,29,.10));

color:var(--dark);

font-weight:600;

text-align:center;

}

.hint strong{

color:var(--primary);

}

color:var(--primary);

}

.bar{

height:28px;

background:#dbe8f6;

border-radius:50px;

overflow:hidden;

position:relative;

}

.fill{

height:100%;

width:0%;

border-radius:50px;

background:linear-gradient(90deg,#00C853,#00E676,#64DD17);

transition:width .8s ease;

position:relative;

overflow:hidden;

}

.fill::after{

content:"";

position:absolute;

top:0;

left:-120px;

width:120px;

height:100%;

background:rgba(255,255,255,.45);

transform:skewX(-30deg);

animation:shine 2s linear infinite;

}

@keyframes shine{

100%{

left:120%;

}

}

@keyframes slideDown{

from{

opacity:0;

transform:translateY(-30px);

}

to{

opacity:1;

transform:translateY(0);

}

}

@keyframes cardPulse{

0%{

transform:scale(1);

box-shadow:0 15px 30px rgba(0,0,0,.15);

}

50%{

transform:scale(1.04);

box-shadow:0 22px 40px rgba(0,91,172,.22);

}

100%{

transform:scale(1);

box-shadow:0 15px 30px rgba(0,0,0,.15);

}

}

@media(max-width:920px){

.content-grid{

grid-template-columns:1fr;

}

}

@media(max-width:768px){

.header{

text-align:center;

justify-content:center;

gap:20px;

}

.input-area{

grid-template-columns:1fr;

}

.title h1{

font-size:24px;

}

.card h2{

font-size:34px;

}

#percent{

font-size:30px;

}

}
/* ===============================
   CIRCLE PROGRESS
================================ */

.circle-wrapper{

margin-top:35px;

display:flex;

justify-content:center;

align-items:center;

}

.circle{

width:170px;

height:170px;

border-radius:50%;

background:conic-gradient(var(--green) 0deg,#d8e4ef 0deg);

display:flex;

align-items:center;

justify-content:center;

transition:.8s;

}

.circle::before{

content:"";

width:130px;

height:130px;

background:white;

border-radius:50%;

position:absolute;

}

.circle span{

position:absolute;

font-size:34px;

font-weight:700;

color:var(--primary);

z-index:10;

}

/* ===============================
BUTTON
================================ */

.action{

margin-top:35px;

display:flex;

gap:15px;

flex-wrap:wrap;

}

.btn{

padding:14px 24px;

border:none;

border-radius:12px;

font-size:15px;

font-weight:600;

cursor:pointer;

transition:.3s;

}

.btn-primary{

background:var(--primary);

color:white;

}

.btn-primary:hover{

background:#00498b;

transform:translateY(-3px);

}

.btn-light{

background:white;

color:#333;

box-shadow:0 5px 15px rgba(0,0,0,.1);

}

.btn-light:hover{

transform:translateY(-3px);

}

.footer{

margin-top:40px;

text-align:center;

color:#666;

font-size:14px;

padding-bottom:30px;

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div class="title">

<h1>
<i class="fa-solid fa-chart-line"></i>
MONITORING PROGRESS PENDATAAN
</h1>

<p>SENSUS EKONOMI 2026</p>

</div>

<div class="logo">

<i class="fa-solid fa-chart-column"></i>

</div>

</div>

<!-- =======================
CONTENT GRID
======================= -->

<div class="content-grid">

<div class="panel">

<div class="progress-section">

<div class="progress-title">

<h2>Progress Pendataan</h2>

<div id="percent">

0%

</div>

</div>

<div class="bar">

<div class="fill" id="fill"></div>

</div>

<div class="circle-wrapper">

<div class="circle" id="circle">

<span id="circleText">

0%

</span>

</div>

</div>

<div class="hint" id="remainingSubmit">

Butuh 0 submit lagi untuk mencapai 100%

</div>

<div class="action">

<button class="btn btn-primary" id="resetBtn">

<i class="fa-solid fa-rotate-left"></i>

Reset

</button>

<button class="btn btn-light" onclick="window.print()">

<i class="fa-solid fa-print"></i>

Print

</button>

</div>

</div>

</div>

<div class="panel">

<div class="input-area">

<div class="box">

<label>Target</label>

<input type="number" id="target" value="0">

</div>

<div class="box">

<label>Approve</label>

<input type="number" id="approve" value="0">

</div>

<div class="box">

<label>Submit</label>

<input type="number" id="submit" value="0">

</div>

<div class="box">

<label>Reject</label>

<input type="number" id="reject" value="0">

</div>

</div>

</div>

</div>

<!-- =======================
CARD
======================= -->

<div class="dashboard">

<div class="card orange">

<h4>TARGET</h4>

<h2 id="cTarget">0</h2>

</div>

<div class="card yellow">

<h4>SUBMIT</h4>

<h2 id="cSubmit">0</h2>

</div>

<div class="card green">

<h4>APPROVE</h4>

<h2 id="cApprove">0</h2>

</div>

<div class="card red">

<h4>REJECT</h4>

<h2 id="cReject">0</h2>

</div>

<div class="card blue">

<h4>TOTAL</h4>

<h2 id="cTotal">0</h2>

</div>

<div class="card purple">

<h4>OPEN</h4>

<h2 id="cOpen">0</h2>

</div>

</div>

<div class="footer">

© 2026 Ziez Studio - Monitoring Progress Pendataan SE2026

</div>

<script>

//==============================
// Ambil Semua Input
//==============================

const inputs = document.querySelectorAll("input[type='number']");

inputs.forEach(input=>{
    input.addEventListener("input",hitung);
    input.addEventListener("change",hitung);
    input.addEventListener("keyup",hitung);
});

//==============================
// Format Angka Animasi
//==============================

function animateValue(id,endValue){

    const obj=document.getElementById(id);
    const card=obj.closest(".card");

    let start=Number(obj.innerText.replace(/,/g,""))||0;
    let duration=450;
    let startTime=null;

    const easeOutCubic=(t)=>1-Math.pow(1-t,3);

    function animation(currentTime){

        if(!startTime) startTime=currentTime;

        let progress=Math.min((currentTime-startTime)/duration,1);
        let eased=easeOutCubic(progress);
        let value=Math.round(start+(endValue-start)*eased);

        obj.innerText=value.toLocaleString("id-ID");

        if(card){
            card.classList.remove("active");
            void card.offsetWidth;
            card.classList.add("active");
        }

        if(progress<1){

            requestAnimationFrame(animation);

        }else{

            obj.innerText=(endValue||0).toLocaleString("id-ID");

            if(card){
                card.classList.remove("active");
            }

        }

    }

    requestAnimationFrame(animation);

}

//==============================
// Hitung
//==============================

function hitung(){

let target=
Number(document.getElementById("target").value)||0;

let approve=
Number(document.getElementById("approve").value)||0;

let submit=
Number(document.getElementById("submit").value)||0;

let reject=
Number(document.getElementById("reject").value)||0;

//====================

let total=
approve+
submit-
reject;

if(total<0){

total=0;

}

let open=
target-total;

if(open<0) open=0;

let persen=0;

if(target>0){

persen=(total/target)*100;

}

if(persen>100){

persen=100;

}

let neededSubmit=Math.max(target-total,0);

const remainingEl=document.getElementById("remainingSubmit");

remainingEl.innerHTML=
neededSubmit>0
?`Butuh <strong>${neededSubmit.toLocaleString("id-ID")}</strong> submit lagi untuk mencapai 100%`
:"Sudah mencapai 100%";

//====================
// Card
//====================

animateValue("cTarget",target);

animateValue("cApprove",approve);

animateValue("cSubmit",submit);

animateValue("cReject",reject);

animateValue("cTotal",total);

animateValue("cOpen",open);

//====================
// Persen
//====================

document.getElementById("percent").innerHTML=
persen.toFixed(1)+"%";

document.getElementById("circleText").innerHTML=
persen.toFixed(1)+"%";

//====================
// Progress Bar
//====================

document.getElementById("fill").style.width=
persen+"%";

//====================
// Circle
//====================

document.getElementById("circle").style.background=

`conic-gradient(
#43A047 ${persen*3.6}deg,
#d8e4ef ${persen*3.6}deg
)`;

}

//==============================
// Reset
//==============================

document.getElementById("resetBtn")

.addEventListener("click",()=>{

document.getElementById("target").value=0;

document.getElementById("approve").value=0;

document.getElementById("submit").value=0;

document.getElementById("reject").value=0;

hitung();

});

//==============================
// Animasi Card Saat Hover
//==============================

document.querySelectorAll(".card").forEach(card=>{

card.addEventListener("mouseenter",()=>{

card.style.transition=".25s";

card.style.transform="translateY(-8px) scale(1.04)";

});

card.addEventListener("mouseleave",()=>{

card.style.transform="translateY(0) scale(1)";

});

});

//==============================
// Jalankan Pertama Kali
//==============================

hitung();

</script>

</body>

</html>
