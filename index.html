<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monitoring Progress Pendataan SE2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

:root{

--primary:#005BAC;
--secondary:#1E88E5;
--orange:#F7941D;
--green:#43A047;
--red:#E53935;
--yellow:#FFD54F;
--purple:#7E57C2;
--dark:#263238;
--white:#ffffff;
--bg:#eef5fb;
--surface:#ffffff;
--surface-alt:#f8fbff;
--surface-soft:#f3f7fc;
--text:#233241;
--muted:#6b7a8f;
--border:#e8eef6;
--input-bg:#ffffff;
--input-border:#dfe8f1;
--track-bg:#eef4f8;
--shadow:rgba(0,0,0,.06);

}

body.dark-mode{

--bg:#07111f;
--surface:#111827;
--surface-alt:#1f2937;
--surface-soft:#273449;
--text:#f3f4f6;
--muted:#9ca3af;
--border:#374151;
--input-bg:#0f172a;
--input-border:#475569;
--track-bg:#243447;
--shadow:rgba(0,0,0,.35);

}

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;

}

body{

background:linear-gradient(135deg,#f5f9ff 0%,#eef4fb 100%);
min-height:100vh;
padding:16px;
color:var(--text);
-webkit-font-smoothing:antialiased;
transition:background .3s ease,color .3s ease;

}

body.dark-mode{
background:linear-gradient(135deg,#07111f 0%,#0f172a 100%);
}

.container{

max-width:820px;
margin:auto;

}

.header{

background:linear-gradient(135deg,var(--surface) 0%,var(--surface-alt) 100%);
color:var(--text);
padding:18px 20px;
border-radius:20px;

display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;

gap:12px;
box-shadow:0 10px 24px var(--shadow);
border:1px solid var(--border);

margin-bottom:14px;

}

.title h1{

font-size:22px;
font-weight:700;

}

.title p{

margin-top:4px;
font-size:13px;
color:var(--muted);

}

.logo{

width:46px;
height:46px;

background:var(--surface-soft);
color:var(--primary);

border-radius:12px;

display:flex;

align-items:center;

justify-content:center;

font-size:20px;

}

.content-grid{

display:grid;
grid-template-columns:1.1fr .9fr;
gap:12px;
align-items:start;
}

.panel{

background:linear-gradient(135deg,var(--surface) 0%,var(--surface-alt) 100%);

padding:14px;

border-radius:18px;

box-shadow:0 8px 24px var(--shadow);
border:1px solid var(--border);

margin-bottom:10px;

}

.input-area{

display:grid;

grid-template-columns:repeat(4, minmax(0, 1fr));
	gap:8px;

}

.box{

background:linear-gradient(135deg,var(--surface-alt) 0%,var(--surface-soft) 100%);

padding:10px;

border-radius:12px;
border:1px solid var(--border);
transition:transform .2s ease, box-shadow .2s ease;

}

.box:hover{
transform:translateY(-1px);
box-shadow:0 6px 14px rgba(0,0,0,.04);
}

.box label{

display:block;

font-weight:600;

margin-bottom:4px;

font-size:11px;

color:var(--muted);
letter-spacing:.3px;

}

.box input{

width:100%;

padding:9px 10px;

font-size:13px;

border:1px solid var(--input-border);

outline:none;

border-radius:10px;

background:var(--input-bg);
color:var(--text);
transition:border-color .2s ease, box-shadow .2s ease;

}

.box input:focus{
border-color:var(--primary);
box-shadow:0 0 0 3px rgba(0,91,172,.08);
}

.progress-section{

padding:0;

}

.progress-title{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:12px;

}

.progress-title h2{

font-size:16px;
color:var(--text);
font-weight:700;

}

#percent{

font-size:24px;
font-weight:700;
color:var(--primary);

}


.progress-compact{

margin:12px 0 8px;

padding:8px 0;

}

.progress-track{

height:24px;

background:var(--track-bg);

border-radius:8px;

position:relative;

overflow:hidden;

box-shadow:inset 0 1px 2px rgba(0,0,0,.06);
border:1px solid var(--border);

}

.progress-fill{

height:100%;

width:0%;

background:linear-gradient(90deg,#0f7bd8,#38c172 60%,#7bdc6b);

border-radius:8px;

transition:width .25s ease;

position:relative;
box-shadow:0 3px 10px rgba(15,123,216,.18);

}


.hint{

margin-top:10px;

padding:10px 12px;

border-radius:12px;

background:linear-gradient(135deg,var(--surface-alt) 0%,var(--surface-soft) 100%);

color:var(--muted);

font-size:13px;

font-weight:600;

text-align:center;
border:1px solid var(--border);

}

.target-summary{

margin-top:8px;

padding:10px 12px;

border-radius:12px;

background:linear-gradient(135deg,var(--surface-alt) 0%,var(--surface-soft) 100%);

border:1px solid var(--border);

text-align:center;

}

.target-label{

font-size:11px;

font-weight:700;

letter-spacing:1px;

text-transform:uppercase;

color:var(--muted);

margin-bottom:2px;

}

.target-value{

font-size:24px;

font-weight:700;

color:var(--primary);

}

.action{

margin-top:14px;

display:flex;

gap:10px;

}

.btn{

flex:1;

padding:11px 12px;

border:none;

border-radius:10px;

font-size:14px;

font-weight:600;

cursor:pointer;
transition:transform .2s ease, box-shadow .2s ease, background .2s ease;

}

.btn:hover{
transform:translateY(-1px);
}

.btn-primary{

background:linear-gradient(135deg,var(--primary) 0%,#1e83d0 100%);
color:white;
box-shadow:0 6px 14px rgba(0,91,172,.18);

}

.btn-light{

background:var(--surface-soft);
color:var(--text);
box-shadow:0 4px 10px rgba(0,0,0,.03);

}

.dashboard{

margin-top:10px;

display:grid;

grid-template-columns:repeat(2,1fr);
	gap:10px;

}

.card{

border-radius:14px;

padding:14px;

color:white;

box-shadow:0 8px 18px rgba(0,0,0,.06);
border:1px solid rgba(255,255,255,.18);
transition:transform .2s ease, box-shadow .2s ease;

}

.card:hover{
transform:translateY(-2px);
box-shadow:0 10px 20px rgba(0,0,0,.08);
}

.card h4{

font-size:12px;

letter-spacing:.4px;

opacity:.95;

}

.card h2{

margin-top:10px;

font-size:24px;

font-weight:700;

}

.orange{background:linear-gradient(135deg,#f29a1f,#ef7c00);}
.green{background:linear-gradient(135deg,#44a34d,#2f8d3d);}
.red{background:linear-gradient(135deg,#f05a57,#d63a36);}
.blue{background:linear-gradient(135deg,#3b93e7,#226fc2);}
.dark{background:linear-gradient(135deg,#4b5963,#2f3941);}
.yellow{background:linear-gradient(135deg,#f8da6a,#efc53d);color:#233241;}
.purple{background:linear-gradient(135deg,#8a68d7,#6a4ec0);}

.footer{

margin-top:18px;
text-align:center;
color:var(--muted);
font-size:12px;
padding-bottom:8px;
padding-top:8px;

}

@media(max-width:480px){

body{padding:12px;}

.header{padding:14px;}

.title h1{font-size:20px;}

.content-grid{grid-template-columns:1fr;}

.input-area{grid-template-columns:repeat(2, minmax(0, 1fr));}

.dashboard{grid-template-columns:1fr 1fr;}

.action{flex-direction:column;}

}
/* ===============================
   CIRCLE PROGRESS
================================ */

.circle-wrapper{

margin-top:35px;

display:flex;

justify-content:center;

align-items:center;

}

.circle{

width:150px;

height:150px;

border-radius:50%;

background:conic-gradient(var(--green) 0deg,#d8e4ef 0deg);

display:flex;

align-items:center;

justify-content:center;

transition:background .3s ease;

box-shadow:0 4px 12px rgba(0,0,0,.06);

position:relative;

}

.circle::before{

content:"";

width:130px;

height:130px;

background:white;

border-radius:50%;

position:absolute;

}

.circle span{

position:absolute;

font-size:34px;

font-weight:700;

color:var(--primary);

z-index:10;

}

/* ===============================
BUTTON
================================ */

.action{

margin-top:35px;

display:flex;

gap:15px;

flex-wrap:wrap;

}

.btn{

padding:14px 24px;

border:none;

border-radius:12px;

font-size:15px;

font-weight:600;

cursor:pointer;

transition:.3s;

}

.btn-primary{

background:var(--primary);

color:white;

}

.btn-primary:hover{

background:#00498b;

transform:translateY(-3px);

}

.btn-light{

background:white;

color:#333;

box-shadow:0 5px 15px rgba(0,0,0,.1);

}

.btn-light:hover{

transform:translateY(-3px);

}

.footer{

margin-top:40px;

text-align:center;

color:var(--muted);

font-size:14px;

padding-bottom:30px;

}

.theme-toggle{

margin-left:auto;
display:inline-flex;
align-items:center;
gap:8px;
padding:8px 12px;
background:var(--surface-soft);
color:var(--text);
border:1px solid var(--border);
border-radius:999px;
cursor:pointer;
font-size:13px;
font-weight:600;
transition:transform .2s ease, background .2s ease;

}

.theme-toggle:hover{
transform:translateY(-1px);
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div class="title">

<h1>
<i class="fa-solid fa-chart-line"></i>
MONITORING PROGRESS PENDATAAN
</h1>

<p>SENSUS EKONOMI 2026</p>

</div>

<div style="display:flex; align-items:center; gap:10px;">

<button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch mode">
<i class="fa-solid fa-moon"></i>
<span>Dark Mode</span>
</button>

<div class="logo">

<i class="fa-solid fa-chart-column"></i>

</div>

</div>

</div>

<!-- =======================
CONTENT GRID
======================= -->

<div class="content-grid">

<div class="panel">

<div class="progress-section">

<div class="progress-title">

<h2>Progress Pendataan</h2>

<div id="percent">

0%

</div>

</div>

<div class="progress-compact">

<div class="progress-track" id="progressTrack">

<div class="progress-fill" id="fill" data-percent="0"></div>

</div>

</div>

<div class="hint" id="remainingSubmit">

Semangat, butuh 0 submit untuk mencapai 75% dan 0 submit untuk mencapai 100%

</div>

<div class="target-summary">

<div class="target-label">Target</div>

<div class="target-value" id="cTarget">0</div>

</div>

<div class="action">

<button class="btn btn-primary" id="resetBtn">

<i class="fa-solid fa-rotate-left"></i>

Reset

</button>


</div>

</div>

</div>

<div class="panel">

<div class="input-area">

<div class="box">

<label>Open</label>

<input type="number" id="open" value="0">

</div>

<div class="box">

<label>Approve</label>

<input type="number" id="approve" value="0">

</div>

<div class="box">

<label>Submit</label>

<input type="number" id="submit" value="0">

</div>

<div class="box">

<label>Reject</label>

<input type="number" id="reject" value="0">

</div>

</div>

</div>

</div>

<div class="footer">

© 2026 Ziez Studio - Monitoring Progress Pendataan SE2026

</div>

<script>

//==============================
// Ambil Semua Input
//==============================

const inputs = document.querySelectorAll("input[type='number']");
const themeToggle=document.getElementById("themeToggle");
const savedTheme=localStorage.getItem("theme");

if(savedTheme === "dark"){
    document.body.classList.add("dark-mode");
}

function updateThemeButton(){
    const isDark=document.body.classList.contains("dark-mode");
    const icon=themeToggle.querySelector("i");
    const label=themeToggle.querySelector("span");

    icon.className=isDark?"fa-solid fa-sun":"fa-solid fa-moon";
    label.textContent=isDark?"Light Mode":"Dark Mode";
}

updateThemeButton();

themeToggle.addEventListener("click",()=>{
    document.body.classList.toggle("dark-mode");
    const isDark=document.body.classList.contains("dark-mode");
    localStorage.setItem("theme", isDark?"dark":"light");
    updateThemeButton();
});

inputs.forEach(input=>{
    input.addEventListener("input",hitung);
    input.addEventListener("change",hitung);
    input.addEventListener("keyup",hitung);
    input.addEventListener("focus",()=>{
        if(input.value === "0"){
            input.value = "";
        }
    });
});

//==============================
// Format Angka Animasi
//==============================

function animateValue(id,endValue){

    const obj=document.getElementById(id);

    if(!obj){
        return;
    }

    let start=Number(obj.innerText.replace(/,/g,""))||0;
    let duration=220;
    let startTime=null;

    const easeOutCubic=(t)=>1-Math.pow(1-t,3);

    function animation(currentTime){

        if(!startTime) startTime=currentTime;

        let progress=Math.min((currentTime-startTime)/duration,1);
        let eased=easeOutCubic(progress);
        let value=Math.round(start+(endValue-start)*eased);

        obj.innerText=value.toLocaleString("id-ID");

        if(progress<1){

            requestAnimationFrame(animation);

        }else{

            obj.innerText=(endValue||0).toLocaleString("id-ID");

        }

    }

    requestAnimationFrame(animation);

}

//==============================
// Animasi Bar Progress
//==============================

function animateProgressBar(targetPercent){

    const fill=document.getElementById("fill");

    if(!fill){
        return;
    }

    const startPercent=Number(fill.dataset.percent)||0;
    const duration=400;
    const startTime=performance.now();

    function easeOutCubic(t){
        return 1-Math.pow(1-t,3);
    }

    function step(currentTime){

        const progress=Math.min((currentTime-startTime)/duration,1);
        const eased=easeOutCubic(progress);
        const value=startPercent+(targetPercent-startPercent)*eased;

        fill.style.width=value.toFixed(2)+"%";
        fill.dataset.percent=value;

        if(progress<1){
            requestAnimationFrame(step);
        }else{
            fill.style.width=targetPercent.toFixed(2)+"%";
            fill.dataset.percent=targetPercent;
        }

    }

    requestAnimationFrame(step);

}

//==============================
// Hitung
//==============================

function hitung(){

let open=
Number(document.getElementById("open").value)||0;

let approve=
Number(document.getElementById("approve").value)||0;

let submit=
Number(document.getElementById("submit").value)||0;

let reject=
Number(document.getElementById("reject").value)||0;

//====================

let target=open+submit+approve;

let total=
approve+
submit-
reject;

if(total<0){

total=0;

}

let persen=0;

if(target>0){

persen=(total/target)*100;

}

if(persen>100){

persen=100;

}

// Untuk mencapai 75%, target dianggap tetap, sehingga:
// (total + x) / target = 0.75
// sehingga x = 0.75 * target - total
// Tambahkan buffer +2 agar angka tampil lebih aman dan tidak terlalu tipis.
let needed75Raw=Math.max(Math.floor(0.75 * target - total),0);
let needed75=needed75Raw + 2;
let needed100=Math.max(Math.floor(target - total),0);

const remainingEl=document.getElementById("remainingSubmit");

remainingEl.innerHTML=`Semangat, butuh <strong>${needed75.toLocaleString("id-ID")}</strong> submit untuk mencapai 75% dan <strong>${needed100.toLocaleString("id-ID")}</strong> submit untuk mencapai 100%`;

//====================
// Card
//====================

animateValue("cTarget",target);

animateValue("cApprove",approve);

animateValue("cSubmit",submit);

animateValue("cReject",reject);

animateValue("cTotal",total);

animateValue("cOpen",open);

//====================
// Persen
//====================

document.getElementById("percent").innerHTML=
persen.toFixed(1)+"%";

//====================
// Progress Bar
//====================

animateProgressBar(persen);

}

//==============================
// Reset
//==============================

document.getElementById("resetBtn")

.addEventListener("click",()=>{

document.getElementById("open").value=0;

document.getElementById("approve").value=0;

document.getElementById("submit").value=0;

document.getElementById("reject").value=0;

hitung();

});

//==============================
// Jalankan Pertama Kali
//==============================

hitung();

</script>

</body>

</html>
